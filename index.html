    transform: rotate(17deg);

      wlButtonSweep

      ease-in-out

  .wl-btn-card:nth-child(2)::after {

  /* garis hidup di bagian atas card */
  .wl-btn-label {

        90deg,
        transparent,
        rgba(255, 49, 93, 0.85),
        rgba(255, 255, 255, 0.50),

      radial-gradient(

  .wl-icon-box::before {
    content: "";

    border-radius: 11px;

  /* =========================================================

  .wl-action-link {
    position: relative;
    z-index: 5;
    isolation: isolate;
    overflow: hidden;

    flex: 0 0 auto;

    min-width: 110px;
    min-height: 48px;

    padding: 13px 17px;

    align-items: center;

      filter 0.25s ease,
      border-color 0.25s ease,
      box-shadow 0.25s ease,
      background 0.25s ease;

  .wl-action-link::before {
    content: "";

    position: absolute;
    top: 0;
    left: -125%;
    z-index: -1;

    pointer-events: none;

    background:

        105deg,

        rgba(255, 255, 255, 0.48),

    animation:
      wlButtonSweep

.rain-container{

}

.drop{

  background:linear-gradient(180deg,
    transparent 0%,
    rgba(174,194,224,.35) 40%,

}

  /* ============ LIGHTNING FLASH (Petir Kilat) ============ */
.lightning{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:4;
  background:transparent;
  mix-blend-mode:screen;
  animation:lightningFlash 9s ease-in-out infinite;
  will-change:background-color;
}

@keyframes lightningFlash{
  0%, 17%, 21%, 23%, 25%, 27%, 59%, 61%, 63%, 100%{ background:transparent }
  18% { background:rgba(255,255,255,.92) }
  19% { background:rgba(255,255,255,.35) }
  20% { background:rgba(180,210,255,.65) }
  22% { background:rgba(255,255,255,.85) }
  24% { background:rgba(160,190,255,.5) }
  26% { background:rgba(255,255,255,.7) }
  60% { background:rgba(255,255,255,.95) }
  62% { background:rgba(170,200,255,.6) }
}

/* ============ LIGHTNING BOLT (Visual Kilat) ============ */
.bolt{
  position:fixed;
  top:-4%;
  left:22%;
  width:90px;
  height:60vh;
  pointer-events:none;
  z-index:5;
  opacity:0;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 240' preserveAspectRatio='none'><polygon points='38,0 8,108 28,108 4,240 56,92 32,92 52,0' fill='white' stroke='%23a8c8ff' stroke-width='1.2'/></svg>") center/contain no-repeat;
  filter:
    drop-shadow(0 0 6px #fff)
    drop-shadow(0 0 16px rgba(180,210,255,.95))
    drop-shadow(0 0 32px rgba(120,180,255,.75))
    drop-shadow(0 0 60px rgba(80,140,255,.55));
  animation:boltFlash 9s ease-in-out infinite;
  will-change:opacity,transform;
}

.bolt.b2{
  left:auto;
  right:14%;
  top:-2%;
  height:55vh;
  width:78px;
  animation-delay:-4.5s;
  transform:scaleX(-1) rotate(6deg);
}

@keyframes boltFlash{
  0%, 17%, 21%, 24%, 100% { opacity:0; transform:translate3d(0,0,0) }
  18%, 19% { opacity:1; transform:translate3d(0,0,0) }
  20% { opacity:.55 }
  22% { opacity:.95; transform:translate3d(2px,0,0) }

}

.arcade-frame{

}

  0%, 16%, 28%, 58%, 66%, 100% { transform:translate3d(0,0,0) }

  18% { transform:translate3d(6px,-4px, 0) }
  19% { transform:translate3d(-5px,-3px, 0) }
  20% { transform:translate3d(5px, 3px, 0) }
  21% { transform:translate3d(-4px, 2px, 0) }
  22% { transform:translate3d(4px,-2px, 0) }
  23% { transform:translate3d(-3px,-1px, 0) }
  24% { transform:translate3d(3px, 1px, 0) }
  25% { transform:translate3d(-2px, 1px, 0) }
  26% { transform:translate3d(2px,-1px, 0) }
  27% { transform:translate3d(-1px, 0, 0) }
